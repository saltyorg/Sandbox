---
################################
# Basics
################################

plextraktsync_instances: ['plextraktsync']

################################
# Paths
################################

plextraktsync_role_paths_folder: "{{ plextraktsync_name }}"
plextraktsync_role_paths_location: "{{ server_appdata_path }}/{{ plextraktsync_role_paths_folder }}"
plextraktsync_role_paths_config_location: "{{ plextraktsync_role_paths_location }}/servers.yml"
plextraktsync_role_paths_folders_list:
  - "{{ plextraktsync_role_paths_location }}"

################################
# Docker
################################

# Container
plextraktsync_role_docker_container: "{{ plextraktsync_name }}"

# Image
plextraktsync_role_docker_image_pull: true
plextraktsync_role_docker_image_tag: "latest"
plextraktsync_role_docker_image_repo: "lscr.io/linuxserver-labs/plextraktsync"
plextraktsync_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='plextraktsync') }}:{{ lookup('role_var', '_docker_image_tag', role='plextraktsync') }}"

# Envs
plextraktsync_role_docker_envs_default:
  TZ: "{{ tz }}"
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
plextraktsync_role_docker_envs_custom: {}
plextraktsync_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='plextraktsync')
                                    | combine(lookup('role_var', '_docker_envs_custom', role='plextraktsync')) }}"

# Volumes
plextraktsync_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_location', role='plextraktsync') }}:/config"
plextraktsync_role_docker_volumes_custom: []
plextraktsync_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='plextraktsync')
                                       + lookup('role_var', '_docker_volumes_custom', role='plextraktsync') }}"

# Hostname
plextraktsync_role_docker_hostname: "{{ plextraktsync_name }}"

# Networks
plextraktsync_role_docker_networks_alias: "{{ plextraktsync_name }}"
plextraktsync_role_docker_networks_default: []
plextraktsync_role_docker_networks_custom: []
plextraktsync_role_docker_networks: "{{ docker_networks_common
                                        + lookup('role_var', '_docker_networks_default', role='plextraktsync')
                                        + lookup('role_var', '_docker_networks_custom', role='plextraktsync') }}"

# Restart Policy
plextraktsync_role_docker_restart_policy: unless-stopped
