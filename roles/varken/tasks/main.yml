---
- name: Validate MaxMind license key
  ansible.builtin.assert:
    that:
      - lookup('role_var', '_maxmind_license_key', role='varken') | trim | length > 0
    fail_msg: "Varken requires a MaxMind license key. Set varken_role_maxmind_license_key in the inventory before installing Varken."
    quiet: true
  when: (not continuous_integration)

- name: Set Default Tautulli instance
  ansible.builtin.set_fact:
    tautulli_name: "{{ tautulli_instances[0] }}"
  when: (not tautulli_name is defined)

- name: Set Default Ombi instance
  ansible.builtin.set_fact:
    ombi_name: "{{ ombi_instances[0] }}"
  when: (not ombi_name is defined)

- name: Set Default Sonarr instance
  ansible.builtin.set_fact:
    sonarr_name: "{{ sonarr_instances[0] }}"
  when: (not sonarr_name is defined)

- name: Set Default Radarr instance
  ansible.builtin.set_fact:
    radarr_name: "{{ radarr_instances[0] }}"
  when: (not radarr_name is defined)

- name: Stop and remove any existing containers
  community.docker.docker_container:
    name: "{{ item }}"
    container_default_behavior: compatibility
    tls_hostname: localhost
    state: absent
  loop:
    - varken
    - telegraf

- name: InfluxDB Role
  ansible.builtin.include_role:
    name: influxdb

- name: Telegraf Role
  ansible.builtin.include_role:
    name: telegraf
  vars:
    telegraf_instances: ["telegraf"]

- name: Grafana Role
  ansible.builtin.include_role:
    name: grafana

- name: Create required directories
  ansible.builtin.file:
    path: "{{ server_appdata_path }}/varken"
    state: directory
    mode: "0775"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"

- name: Set appdata ownership
  ansible.builtin.file:
    path: "{{ server_appdata_path }}/varken"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    recurse: true

- name: Check if varken config exists
  ansible.builtin.stat:
    path: "{{ server_appdata_path }}/varken/varken.ini"
  register: varken_config_stat

- name: Import config tasks
  ansible.builtin.import_tasks: config.yml
  when: (not varken_config_stat.stat.exists)

- name: Create and start varken container
  community.docker.docker_container:
    name: varken
    image: "ghcr.io/thezak48/varken:develop"
    pull: true
    command_handling: compatibility
    container_default_behavior: compatibility
    default_host_ip: ""
    env:
      TZ: "{{ tz }}"
    user: "{{ uid }}:{{ gid }}"
    volumes:
      - "{{ server_appdata_path }}/varken:/config"
    labels:
      "com.github.saltbox.saltbox_managed": "true"
    networks:
      - name: saltbox
        aliases:
          - varken
    network_mode: "saltbox"
    networks_cli_compatible: true
    comparisons:
      '*': ignore
    tls_hostname: localhost
    restart_policy: unless-stopped
    state: started
