---
- name: Check for legacy Silo PostgreSQL data
  ansible.builtin.stat:
    path: "{{ lookup('role_var', '_paths_location', role='silo') }}/postgres/PG_VERSION"
  register: silo_legacy_postgres

- name: Check for legacy Silo plugins folder
  ansible.builtin.stat:
    path: "{{ lookup('role_var', '_paths_location', role='silo') }}/plugins"
  register: silo_legacy_plugins

- name: Check for completed Silo migration
  ansible.builtin.stat:
    path: "{{ lookup('role_var', '_paths_location', role='silo') }}/config/.compose-cluster-copied"
  register: silo_migration_marker

- name: Validate Silo migration state
  ansible.builtin.fail:
    msg: "A legacy multi-container Silo installation was found, but it has not been migrated. Run 'sb install sandbox-silo-migrate' before installing Silo."
  when:
    - (silo_legacy_postgres.stat.exists or silo_legacy_plugins.stat.exists)
    - (not silo_migration_marker.stat.exists)

- name: "Save Silo Saltbox facts"
  saltbox_facts:
    role: "silo"
    instance: "silo"
    keys:
      secret_key: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=50) }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    base_path: "{{ server_appdata_path }}"
  register: silo_saltbox_facts

- name: Remove existing Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: Add DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record', role='silo') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone', role='silo') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy', role='silo') }}"

- name: Add DNS record (Jellyfin-compatible endpoint)
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_jf_dns_record', role='silo') }}"
    dns_zone: "{{ lookup('role_var', '_jf_dns_zone', role='silo') }}"
    dns_proxy: "{{ lookup('role_var', '_jf_dns_proxy', role='silo') }}"
  when: (lookup('role_var', '_jf_enabled', role='silo') | bool)

- name: Add DNS record (Audiobookshelf-compatible endpoint)
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_abs_dns_record', role='silo') }}"
    dns_zone: "{{ lookup('role_var', '_abs_dns_zone', role='silo') }}"
    dns_proxy: "{{ lookup('role_var', '_abs_dns_proxy', role='silo') }}"
  when: (lookup('role_var', '_abs_enabled', role='silo') | bool)

- name: Create directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: Create Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"
