---
- name: Save Homebox Saltbox facts
  saltbox_facts:
    role: "homebox"
    instance: "homebox"
    keys:
      api_key_pepper: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=64) }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    base_path: "{{ server_appdata_path }}"
  register: homebox_saltbox_facts
  no_log: true

- name: Validate Homebox API key pepper
  ansible.builtin.assert:
    that:
      - lookup('role_var', '_auth_api_key_pepper') | length >= 32
    fail_msg: "homebox_role_auth_api_key_pepper must be at least 32 characters."
    quiet: true

- name: Add DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy') }}"

- name: Remove existing Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: Create directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: Create Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"

- name: Print Tweaking Info
  ansible.builtin.debug:
    msg: "For custom docker envs, please visit: https://homebox.software/en/quick-start.html"
