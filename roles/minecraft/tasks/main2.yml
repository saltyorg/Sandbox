---
- name: Add DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy') }}"

- name: Remove existing Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: Assign port
  port_assignment:
    base_path: "{{ server_appdata_path }}"
    namespace: minecraft
    owner: "{{ minecraft_name }}"
    claims:
      game:
        low_bound: "{{ lookup('role_var', '_port_game_low_bound', role='minecraft') }}"
        high_bound: "{{ lookup('role_var', '_port_game_high_bound', role='minecraft') }}"
        protocols: ["tcp"]
  register: minecraft_port_assignment

- name: Add SRV record
  community.general.cloudflare_dns:
    account_api_key: "{{ cloudflare.api }}"
    account_email: "{{ cloudflare.email }}"
    port: "{{ minecraft_port_assignment.ports.game }}"
    priority: 1
    proto: tcp
    proxied: false
    record: "{{ _dns_tasker_record }}"
    service: "minecraft"
    solo: true
    state: present
    type: SRV
    value: "{{ _dns_tasker_record }}.{{ _dns_tasker_zone }}"
    weight: 1
    zone: "{{ _dns_tasker_zone }}"
  when: cloudflare_is_enabled

- name: Create directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: Create Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"
