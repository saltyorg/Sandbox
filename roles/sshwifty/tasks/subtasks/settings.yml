---
- name: Settings | Check if `{{ lookup('role_var', '_paths_config_location', role='sshwifty') | basename }}` exists
  ansible.builtin.stat:
    path: "{{ lookup('role_var', '_paths_config_location', role='sshwifty') }}"
  register: sshwifty_config

- name: Settings | New `{{ lookup('role_var', '_paths_config_location', role='sshwifty') | basename }}` tasks
  when: not sshwifty_config.stat.exists
  block:
    - name: Settings | Import default `{{ lookup('role_var', '_paths_config_location', role='sshwifty') | basename }}`
      ansible.builtin.template:
        src: sshwifty.conf.json.j2
        dest: "{{ lookup('role_var', '_paths_config_location', role='sshwifty') }}"
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        mode: "0664"
