---
- name: Check for Koito SQLite database
  ansible.builtin.stat:
    path: "{{ lookup('role_var', '_paths_location_data', role='koito') }}/koito.db"
  register: koito_sqlite_database

- name: Check Koito SQLite migration
  ansible.builtin.command:
    argv:
      - sqlite3
      - -readonly
      - "{{ lookup('role_var', '_paths_location_data', role='koito') }}/koito.db"
      - "PRAGMA quick_check; SELECT COUNT(*) FROM users;"
  register: koito_sqlite_check
  changed_when: false
  failed_when: false
  when: koito_sqlite_database.stat.exists

- name: Set Koito migration status
  ansible.builtin.set_fact:
    koito_migration_complete: "{{ koito_sqlite_database.stat.exists and (koito_sqlite_check.rc | default(1) == 0) and (koito_sqlite_check.stdout_lines | default([]) | first | default('') == 'ok') and (koito_sqlite_check.stdout_lines | default([]) | last | default('0') | int > 0) }}"

- name: Check for legacy Koito PostgreSQL data
  ansible.builtin.stat:
    path: "{{ lookup('role_var', '_paths_location', role='koito') }}/postgres"
  register: koito_postgres_data

- name: Validate Koito migration state
  ansible.builtin.fail:
    msg: "A legacy Koito PostgreSQL database was found, but a complete SQLite migration was not. Run 'sb install sandbox-koito-migrate' before installing Koito."
  when:
    - koito_postgres_data.stat.exists
    - not koito_migration_complete
    - not (koito_migration_running | default(false))

- name: Validate existing Koito SQLite database
  ansible.builtin.fail:
    msg: "The existing Koito SQLite database failed its integrity or user checks. Restore a valid database before installing Koito."
  when:
    - koito_sqlite_database.stat.exists
    - not koito_migration_complete
    - not (koito_migration_running | default(false))

- name: Validate ListenBrainz relay configuration
  ansible.builtin.fail:
    msg: "koito_role_lbz_relay_url and koito_role_lbz_relay_token are required when koito_role_enable_lbz_relay is true."
  when:
    - (lookup('role_var', '_enable_lbz_relay', role='koito') == 'true')
    - (lookup('role_var', '_lbz_relay_url', role='koito') | trim | length == 0) or (lookup('role_var', '_lbz_relay_token', role='koito') | trim | length == 0)

- name: Validate Subsonic configuration
  ansible.builtin.fail:
    msg: "koito_role_subsonic_url and koito_role_subsonic_params must be set together."
  when: (lookup('role_var', '_subsonic_url', role='koito') | trim | length > 0) != (lookup('role_var', '_subsonic_params', role='koito') | trim | length > 0)

- name: Create directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: Remove legacy Koito PostgreSQL container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"
  vars:
    container_name: "{{ koito_role_postgres_name | default(koito_name + '-postgres') }}"
  when:
    - koito_migration_complete
    - not (koito_migration_running | default(false))

- name: Add DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy') }}"

- name: Remove existing Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: Create Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"
