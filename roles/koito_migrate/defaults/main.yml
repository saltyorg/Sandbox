---
################################
# Basics
################################

koito_migrate_name: koito-migrate

################################
# Settings
################################

koito_migrate_role_postgres_deploy: "{{ koito_role_postgres_deploy | default(true) }}"
koito_migrate_role_database_url: "{{ koito_role_database_url | default('') }}"
koito_migrate_role_docker_envs_custom: {}

################################
# Postgres
################################

koito_migrate_role_postgres_name: "{{ koito_role_postgres_name | default(koito_name + '-postgres') }}"
koito_migrate_role_postgres_user: "{{ koito_role_postgres_user | default('') }}"
koito_migrate_role_postgres_password: "{{ koito_role_postgres_password | default('') }}"
koito_migrate_role_postgres_docker_env_db: "{{ koito_role_postgres_docker_env_db | default('koitodb') }}"
koito_migrate_role_postgres_docker_image_tag: "{{ koito_role_postgres_docker_image_tag | default('16') }}"
koito_migrate_role_postgres_docker_image_repo: "{{ koito_role_postgres_docker_image_repo | default('postgres') }}"
koito_migrate_role_postgres_docker_healthcheck:
  test: ["CMD-SHELL", "pg_isready -d {{ lookup('role_var', '_postgres_docker_env_db', role='koito_migrate') }} -U {{ lookup('role_var', '_postgres_user', role='koito_migrate') if (lookup('role_var', '_postgres_user', role='koito_migrate') | length > 0) else lookup('role_var', '_docker_env_user', role='postgres') }}"]
  start_period: 20s
  interval: 30s
  retries: 5
  timeout: 5s
koito_migrate_role_postgres_paths_location: "{{ lookup('role_var', '_paths_location', role='koito') }}/postgres"
