---
- name: Save n8n Saltbox facts
  saltbox_facts:
    role: "n8n"
    instance: "n8n"
    keys:
      runners_auth_token: "{{ lookup('community.general.random_string', length=64, min_lower=1, min_upper=1, min_numeric=1) }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    base_path: "{{ server_appdata_path }}"
  register: n8n_saltbox_facts

- name: Remove legacy PostgreSQL Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"
  vars:
    container_name: "{{ n8n_name }}_postgres"

- name: Check legacy path
  ansible.builtin.stat:
    path: "{{ n8n_role_paths_location }}/app"
  register: stat_n8n_legacy_path

- name: "Import Postgres Role"
  ansible.builtin.include_role:
    name: postgres
  vars:
    postgres_instances: ["{{ lookup('role_var', '_postgres_name', role='n8n') }}"]
    postgres_role_docker_image_tag: "{{ lookup('role_var', '_postgres_docker_image_tag', role='n8n') }}"
    postgres_role_docker_image_repo: "{{ lookup('role_var', '_postgres_docker_image_repo', role='n8n') }}"
    postgres_role_paths_folder: "{{ lookup('role_var', '_postgres_paths_folder', role='n8n') }}"
    postgres_role_paths_location: "{{ lookup('role_var', '_postgres_paths_location', role='n8n') }}"
    postgres_role_docker_env_db: "{{ lookup('role_var', '_postgres_docker_env_db', role='n8n') }}"
    postgres_role_docker_env_user_include: "{{ lookup('role_var', '_postgres_user', role='n8n') }}"
    postgres_role_docker_env_password_include: "{{ lookup('role_var', '_postgres_password', role='n8n') }}"
    postgres_role_docker_healthcheck: "{{ lookup('role_var', '_postgres_docker_healthcheck', role='n8n') }}"
  when: lookup('role_var', '_postgres_deploy', role='n8n')

- name: Add DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy') }}"

- name: Remove existing Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: Migrate n8n legacy directory
  migrate_folder:
    legacy_path: "{{ n8n_role_paths_location }}/app"
    new_path: "{{ n8n_role_paths_location }}/data/.n8n"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0775'
    recurse: false
  when: stat_n8n_legacy_path.stat.exists

- name: Create directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: Create Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"

- name: Import n8n Runner Role
  ansible.builtin.include_role:
    name: n8n_runner
  vars:
    n8n_runner_name: "{{ lookup('role_var', '_runners_name', role='n8n') }}"
    n8n_runner_role_docker_image_repo: "{{ lookup('role_var', '_runners_docker_image_repo', role='n8n') }}"
    n8n_runner_role_docker_image_tag: "{{ lookup('role_var', '_runners_docker_image_tag', role='n8n') }}"
    n8n_runner_role_docker_envs_custom: "{{ lookup('role_var', '_runners_docker_envs_custom', role='n8n') }}"
  when: lookup('role_var', '_runners_deploy', role='n8n')

- name: Remove n8n Runner Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"
  vars:
    container_name: "{{ lookup('role_var', '_runners_name', role='n8n') }}"
  when: not lookup('role_var', '_runners_deploy', role='n8n')
